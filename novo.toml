[package]
name        = "l3gd20-nv"
version     = "0.1.0"
description = "A driver for ST's L3GD20 three-axis gyroscope, and the register-compatible I3G4250D, on an SPI bus: the angular rate in milli-degrees per second, the range, the sample rate, the data-ready line and WHO_AM_I, as devices-nv's Gyroscope and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["l3gd20", "i3g4250d", "gyroscope", "spi", "sensor", "stm32f3discovery"]
repository  = "https://github.com/novolang/l3gd20-nv"
maintainers = ["novo-lang"]
# The toolchain floor: 0.19.3 checks each module's generic functions
# against its own module, which a program needs when it binds this
# driver beside another that also declares `start` and `irq_level_of`.
novo        = ">= 0.19.3"

[dependencies]
# The board's SPI bus and GPIO handles, and the SpiBus and GpioOut
# traits they implement.
embedded-hal-nv = "^0.2.1"
# The wiring record a board's device table hands `attach`, the SPI
# transaction helper, and the Gyroscope and Identifiable traits.
devices-nv      = "^0.2.0"
